<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>QFD House Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: navy band on top, a numbered four-step guide, then the house itself as one scrollable grid (roof above, matrix below), results under it. Palette follows the ULACIT system: navy, teal, gold, coral. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#0F1E3A; --muted:#55627B; --line:#D3DAE6;
  --band:#0F2747; --band-ink:#FFFFFF;
  --teal:#0E7C86; --gold:#E0A81C; --gold-ink:#1B1500; --coral:#D9482A;
  --input:#FFF5D6; --callout:#E4F2F3; --callout-ink:#0F1E3A; --m9:#14808A; --m9-ink:#FFFFFF; --m3:#84C6CC; --m3-ink:#0F1E3A; --m1:#DCEFF1; --m1-ink:#0F1E3A;
  --pos2:#14808A; --pos1:#A9DADF; --neg1:#F6B9A9; --neg2:#D9482A; --diamond-ink:#0F1E3A; --diamond-ink-strong:#FFFFFF;
  --serif:Cambria,Caladea,Georgia,serif; --sans:Calibri,Carlito,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1322; --surface:#121E34; --ink:#E7ECF5; --muted:#9DABC4; --line:#253452;
    --band:#08101F; --band-ink:#FFFFFF;
    --teal:#41B7C1; --gold:#E8B93C; --gold-ink:#1B1500; --coral:#F07A58;
    --input:#2A2512; --callout:#10303A; --callout-ink:#E7ECF5; --m9:#1A8791; --m9-ink:#FFFFFF; --m3:#1F5F69; --m3-ink:#E7ECF5; --m1:#17414A; --m1-ink:#DDEBEE;
    --pos2:#1A8791; --pos1:#1F5F69; --neg1:#7A3A2B; --neg2:#D9553A; --diamond-ink:#E7ECF5; --diamond-ink-strong:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#121E34; --ink:#E7ECF5; --muted:#9DABC4; --line:#253452;
  --band:#08101F; --band-ink:#FFFFFF;
  --teal:#41B7C1; --gold:#E8B93C; --gold-ink:#1B1500; --coral:#F07A58;
  --input:#2A2512; --callout:#10303A; --callout-ink:#E7ECF5; --m9:#1A8791; --m9-ink:#FFFFFF; --m3:#1F5F69; --m3-ink:#E7ECF5; --m1:#17414A; --m1-ink:#DDEBEE;
  --pos2:#1A8791; --pos1:#1F5F69; --neg1:#7A3A2B; --neg2:#D9553A; --diamond-ink:#E7ECF5; --diamond-ink-strong:#FFFFFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);margin:0}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top band */
.band{background:var(--band);color:var(--band-ink);padding-block:16px}
.band .wrap{display:flex;gap:16px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.6rem;line-height:1.1}
.brand p{margin:2px 0 0;opacity:.8;font-size:.95rem;max-width:56ch}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:6px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--band-ink);padding:6px 14px;cursor:pointer;font-weight:700;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

main{padding-block:20px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
main>*{min-width:0}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.92rem}
.steps li span small{display:block;color:var(--muted);font-weight:700}
.steps b{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--band);color:var(--band-ink);font-size:.85rem}
@media (max-width:980px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

.tools{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input[type=text],.field select{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
#name{width:min(420px,100%)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.btn[disabled]{opacity:.45;cursor:default}
.chk{display:flex;gap:8px;align-items:center;padding:8px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--teal)}

/* the house */
.house{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.scroll{overflow-x:auto;padding-bottom:6px}
.inner{width:max-content;min-width:100%}
.roofrow{display:flex;align-items:flex-end}
.roofcap{width:306px;flex:none;padding:0 14px 4px 0;font-size:.85rem;color:var(--muted)}
.roofcap b{display:block;color:var(--ink);font-family:var(--serif);font-size:1rem;margin-bottom:2px}
.roofsvg{display:block;flex:none;overflow:visible}
.diamond{cursor:pointer}
.diamond polygon{stroke:var(--line);stroke-width:1}
.diamond.empty polygon{fill:var(--surface);stroke-dasharray:3 3}
.diamond.empty:hover polygon{stroke:var(--teal)}
.diamond.pp polygon{fill:var(--pos2);stroke:var(--pos2)}
.diamond.p polygon{fill:var(--pos1);stroke:var(--pos1)}
.diamond.n polygon{fill:var(--neg1);stroke:var(--neg1)}
.diamond.nn polygon{fill:var(--neg2);stroke:var(--neg2)}
.diamond text{font:700 15px var(--sans);fill:var(--diamond-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.diamond.pp text,.diamond.nn text{fill:var(--diamond-ink-strong)}

.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);width:max-content}
.grid>*{background:var(--surface);min-width:0}
.grid>.sp{background:var(--bg)}
.h{padding:8px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:flex-end}
.h.dark{background:var(--band);color:var(--band-ink)}
.rh{position:relative;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--band)!important;color:var(--band-ink)}
.rh .tag{font-size:.72rem;letter-spacing:.08em;opacity:.75;font-weight:700}
.rh textarea{background:transparent;color:var(--band-ink);border:1px solid rgba(255,255,255,.28);border-radius:4px;resize:none;padding:4px 6px;font-size:.85rem;line-height:1.25;height:64px;width:100%}
.rh textarea::placeholder{color:rgba(255,255,255,.55)}
.x{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:4px;background:transparent;color:inherit;cursor:pointer;opacity:.6;font-size:1rem;line-height:1}
.x:hover{opacity:1;background:rgba(127,127,127,.25)}
.vc{position:relative;padding:4px 26px 4px 4px;background:var(--input)!important}
.vc textarea{width:100%;height:44px;resize:none;border:0;background:transparent;padding:4px 6px;line-height:1.25}
.vc .x{color:var(--muted)}
.ic{display:grid;place-items:center;background:var(--input)!important}
.ic select{border:0;background:transparent;font-weight:700;font-size:1.05rem;text-align:center;cursor:pointer;padding:6px 4px}
.mc{padding:0}
.mc button{width:100%;height:100%;min-height:52px;border:0;cursor:pointer;font-weight:700;font-size:1.05rem;background:transparent;color:var(--muted)}
.mc button:hover{box-shadow:inset 0 0 0 2px var(--teal)}
.mc button[data-v="9"]{background:var(--m9);color:var(--m9-ink)}
.mc button[data-v="3"]{background:var(--m3);color:var(--m3-ink)}
.mc button[data-v="1"]{background:var(--m1);color:var(--m1-ink)}
.addc{display:grid;place-items:center}
.addc button{border:1px dashed var(--muted);background:transparent;border-radius:6px;cursor:pointer;width:34px;height:34px;font-size:1.2rem;color:var(--muted)}
.addc button:hover{border-color:var(--teal);color:var(--teal)}
.addrow{padding:8px;grid-column:1/-1;background:var(--surface)!important}
.addrow button{border:1px dashed var(--muted);background:transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:700}
.addrow button:hover{border-color:var(--teal);color:var(--teal)}
.cs{display:grid;place-items:center;background:var(--input)!important}
.cs select{border:0;background:transparent;font-weight:700;cursor:pointer;padding:6px 2px}
.gp{display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.gp.neg{color:var(--coral)}
.rl{padding:8px 10px;font-weight:700;display:flex;align-items:center;grid-column:span 2;background:var(--band)!important;color:var(--band-ink)}
.rv{display:grid;place-items:center;font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;min-height:38px}
.rv.top{background:var(--gold)!important;color:var(--gold-ink)}


/* guided blocks */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.blk>*{min-width:0}
.blk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.blk-h h2{font-size:1.3rem}
.num{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--band);color:var(--band-ink);font-weight:700;font-family:var(--serif)}
.time{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.cls{background:var(--callout);color:var(--callout-ink);border-radius:8px;padding:10px 14px}
.cls p,.todo p,.gq p{margin:4px 0 0}
.cls .lbl{color:var(--teal)}
.gq{border:1px dashed var(--muted);border-radius:8px;padding:10px 14px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.cases button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 8px;cursor:pointer;font-weight:700}
.cases button:hover{border-color:var(--teal)}
.cases button[aria-pressed="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.casebox{background:var(--bg);border-radius:8px;padding:10px 14px;display:grid;gap:6px}
.casebox p{margin:0}
.notes{width:100%;min-height:92px;background:var(--input);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical;line-height:1.4}
.count{font-size:.85rem;color:var(--muted)}
.count.ok{color:var(--teal);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:980px){.mini{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.mini{grid-template-columns:1fr}}
.mini>div{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.mini h3{font-size:1rem}
.mini p{margin:0;font-size:.9rem}
.mini .c{background:var(--callout);color:var(--callout-ink);border-radius:6px;padding:6px 8px;font-size:.85rem}
.pts{display:grid;gap:12px}
.pts .row{display:grid;gap:4px}
.pts .row>div{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sug{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--teal)}
.sug:hover{border-color:var(--teal)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.sub{font-family:var(--serif);font-size:1.05rem;margin:0 0 8px}

.princ{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px}
.princ label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.princ input{width:18px;height:18px;accent-color:var(--teal)}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.65);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.dlg{background:var(--surface);color:var(--ink);border-radius:12px;padding:20px;max-width:580px;width:100%;max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:12px;border:1px solid var(--line)}
.dlg input,.dlg textarea{width:100%;background:var(--input);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.dlg textarea{min-height:64px;resize:vertical}
.ownsum{display:grid;gap:6px}
.ownsum p{margin:0}
/* results */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:1.2rem;margin-bottom:12px}
.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .t{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}
.bar .t span:first-child{overflow-wrap:anywhere}
.bar .t b{font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--teal);border-radius:6px}
.bar.first .fill{background:var(--gold)}
.badge{display:inline-block;background:var(--gold);color:var(--gold-ink);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:6px}
.read p{margin:0 0 10px}
.read p:last-child{margin-bottom:0}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem}
.checks li{display:flex;gap:8px}
.checks li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--gold)}
.checks li.ok::before{background:var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted);align-items:center}
.legend i{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:4px;font-style:normal;font-weight:700;margin-right:6px;vertical-align:middle}
details{font-size:.92rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;color:var(--ink)}
details p{margin:8px 0 0;max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-ink);padding:8px 16px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<header class="band"><div class="wrap">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M4 21 22 5l18 16" fill="none" stroke="#E0A81C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="9" y="21" width="26" height="18" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M9 30h26M22 21v18" stroke="#fff" stroke-width="1.5" opacity=".6"/></svg>
    <div><h1 id="t-title"></h1><p id="t-sub"></p></div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><div class="lang" role="group" aria-label="Mode"><button type="button" data-mode="ind" aria-pressed="false" id="mInd"></button><button type="button" data-mode="team" aria-pressed="false" id="mTeam"></button></div><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="es" aria-pressed="false">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
</div></header>

<main class="wrap">
  <section class="blk" id="intro">
    <h2 data-t="introTitle"></h2>
    <p data-t="introP" style="margin:0"></p>
    <div class="gq"><span class="lbl" data-t="gqLbl"></span><p data-t="gq"></p></div>
    <ol class="steps" id="timeline"></ol>
  </section>

  <section class="blk" id="b1">
    <div class="blk-h"><span class="num">1</span><h2 data-t="b1"></h2></div>
    <div class="cls"><span class="lbl" data-t="classLbl"></span><p data-t="class1"></p></div>
    <div class="todo"><span class="lbl" data-t="todoLbl"></span><p data-t="do1"></p></div>
    <div class="field team-only"><label class="lbl" for="members" data-t="membersLbl"></label><textarea class="notes" id="members" data-f="members" data-ph="membersPh"></textarea></div>
    <div class="lbl" data-t="casePick"></div>
    <div class="cases" id="cases"></div>
    <div class="casebox" id="casebox"></div>
    <div class="field team-only"><span class="lbl" data-t="princLbl"></span><span class="note" data-t="princHint"></span><div class="princ" id="principles"></div></div>
    <div class="field"><label class="lbl" for="notes" data-t="notesLbl"></label><textarea class="notes" id="notes" data-f="notes" data-ph="notesPh"></textarea></div>
  </section>

  <section class="blk" id="b2">
    <div class="blk-h"><span class="num">2</span><h2 data-t="b2"></h2></div>
    <div class="cls"><span class="lbl" data-t="classLbl"></span><p data-t="class2"></p></div>
    <div class="todo"><span class="lbl" data-t="todoLbl"></span><p data-t="do2"></p></div>
    <div class="gq" id="trig"></div>
    <div class="field"><textarea class="notes" id="ans" data-f="ans" data-ph="ansPh" aria-label="Answer" style="min-height:140px"></textarea><span class="count" id="ansCount"></span></div>
  </section>

  <section class="blk" id="b3">
    <div class="blk-h"><span class="num">3</span><h2 data-t="b3"></h2></div>
    <div class="cls"><span class="lbl" data-t="classLbl"></span><p data-t="class3"></p></div>
    <div class="todo"><span class="lbl" data-t="todoLbl"></span><p data-t="do3"></p></div>
    <div class="mini" id="mini"></div>
    <div class="tools" aria-label="Setup">
      <button type="button" class="btn primary" id="load"></button>
      <button type="button" class="btn" id="blank"></button>
      <button type="button" class="btn" id="undo" disabled></button>
    </div>
    <section class="house" aria-label="House of Quality" style="padding:12px">
      <div class="scroll"><div class="inner" id="inner"></div></div>
      <p class="note" id="t-hint" style="margin:10px 0 0"></p>
    </section>
    <div class="legend" id="legend"></div>
    <div>
      <h3 class="sub" data-t="check"></h3>
      <ul class="checks" id="checks"></ul>
    </div>
    <details><summary id="t-how"></summary><p id="t-how-p"></p></details>
  </section>

  <section class="blk" id="b4">
    <div class="blk-h"><span class="num">4</span><h2 data-t="b4"></h2></div>
    <div class="cls"><span class="lbl" data-t="classLbl"></span><p data-t="class4"></p></div>
    <div class="todo"><span class="lbl" data-t="todoLbl"></span><p data-t="do4"></p></div>
    <div class="two">
      <div><h3 class="sub" data-t="prio"></h3><div class="bars" id="bars"></div></div>
      <div class="read"><h3 class="sub" data-t="read"></h3><div id="read"></div></div>
    </div>
    <div class="pts">
      <div class="row"><div><label class="lbl" for="win" data-t="p1"></label><button type="button" class="sug" data-sug="win" data-t="sug"></button></div><textarea class="notes" id="win" data-f="win" data-ph="p1Ph"></textarea></div>
      <div class="row"><div><label class="lbl" for="trade" data-t="p2"></label><button type="button" class="sug" data-sug="trade" data-t="sug"></button></div><textarea class="notes" id="trade" data-f="trade" data-ph="p2Ph"></textarea></div>
      <div class="row"><div><label class="lbl" for="rec" data-t="p3"></label></div><textarea class="notes" id="rec" data-f="rec" data-ph="p3Ph"></textarea></div>
    </div>
  </section>

  <section class="blk" id="b5">
    <div class="blk-h"><span class="num">5</span><h2 data-t="b5"></h2></div>
    <div class="cls"><span class="lbl" data-t="classLbl"></span><p data-t="class5"></p></div>

function calc(){

    document.querySelectorAll("textarea[data-f]").forEach(el=>{el.value=S[el.dataset.f]||""});
  $("timeline").innerHTML=T.timeline.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t)}</span></li>`).join("");
  $("mini").innerHTML=T.mini.map((x,i)=>`<div><h3>3${"abcd"[i]} · ${esc(x.t)}</h3><p>${esc(x.d)}</p><p class="c">${esc(x.c)}</p></div>`).join("");
  $("load").textContent=T.load; $("blank").textContent=T.blank; $("undo").textContent=T.undo; $("copy").textContent=T.copy;
  $("t-hint").textContent=T.hint;
  const L=T.legend;
  $("legend").innerHTML=`<span><b>${L[0]}:</b></span><span><i style="background:var(--m9);color:var(--m9-ink)">9</i>${L[1]}</span><span><i style="background:var(--m3);color:var(--m3-ink)">3</i>${L[2]}</span><span><i style="background:var(--m1);color:var(--m1-ink)">1</i>${L[3]}</span><span><b>${L[4]}:</b></span><span><i style="background:var(--pos2);color:#fff">++</i>${L[5]}</span><span><i style="background:var(--neg2);color:#fff">−−</i>${L[6]}</span>`;
  $("t-how").textContent=T.how; $("t-how-p").textContent=T.howP;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang?"true":"false"));
  renderCases(); updateCount();
}
function caseName(){return S.caseIdx===8?(S.own.name.trim()||tt().ownLabel):(CASES[S.caseIdx]?CASES[S.caseIdx].n:"")}
function renderCases(){
  const T=tt(), k=S.lang==="es"?1:0, c=CASES[S.caseIdx], own=S.caseIdx===8;
  $("cases").innerHTML=CASES.map((x,i)=>`<button type="button" data-case="${i}" aria-pressed="${i===S.caseIdx}">${x.n}</button>`).join("")+`<button type="button" data-case="own" aria-pressed="${own}">${esc(T.ownBtn)}</button>`;
  if(c)$("casebox").innerHTML=`<p><span class="lbl">${T.principle}</span><br>${esc(c.p[k])}</p><p><span class="lbl">${T.trigger}</span><br>${esc(c.q[k])}</p>`;
  else if(own){const o=S.own;$("casebox").innerHTML=`<div class="ownsum"><p><span class="lbl">${esc(T.ownLabel)}</span><br><b>${esc(o.name||"-")}</b></p>`+[["ownWhat","what"],["ownWho","who"],["ownTension","tension"],["ownNeed","need"]].map(([l,f])=>o[f].trim()?`<p><span class="lbl">${esc(T[l])}</span><br>${esc(o[f])}</p>`:"").join("")+`<div><button type="button" class="btn" data-ownedit>${esc(T.ownEdit)}</button></div></div>`}
  else $("casebox").innerHTML=`<p>${esc(T.pickHint)}</p>`;
  $("trig").innerHTML=c?`<span class="lbl">${T.trigger} · ${c.n}</span><p>${esc(c.q[k])}</p>`:own?`<span class="lbl">${T.trigger} · ${esc(caseName())}</span><p>${esc(T.ownTrigger)}</p>`:`<span class="lbl">${T.trigger}</span><p>${esc(T.pickHint)}</p>`;
}
function openOwn(){
  const T=tt();
  $("ovT").textContent=T.ownTitle;$("ovP").textContent=T.ownIntro;
  [["name","ownName"],["what","ownWhat"],["who","ownWho"],["tension","ownTension"],["need","ownNeed"]].forEach(([f,l])=>{$("l-"+f).textContent=T[l];$("o-"+f).value=S.own[f]||""});
  $("o-name").placeholder=T.ownNamePh;$("o-save").textContent=T.ownSave;$("o-cancel").textContent=T.ownCancel;
  $("ov").hidden=false;$("o-name").focus();
}
function closeOwn(){$("ov").hidden=true}
function updateCount(){const n=wordCount(S.ans),el=$("ansCount");el.textContent=tt().words(n);el.classList.toggle("ok",n>=100&&n<=150)}

function renderHouse(){
  const T=tt(), n=S.r.length, on=S.comp.on;
  const cols=`240px 64px repeat(${n},92px) 52px`+(on?" 16px 58px 58px 58px":"");
  let h=`<div class="roofrow"><div class="roofcap"><b>${T.roofT}</b>${esc(T.roofD)}</div><svg class="roofsvg" id="roof" width="${n*W}" height="${Math.round(n*W/2)}" viewBox="0 0 ${n*W} ${n*W/2}"></svg></div>`;
  h+=`<div class="grid" style="grid-template-columns:${cols}">`;
  h+=`<div class="h dark">${T.voice}</div><div class="h dark">${T.imp}</div>`;
  for(let j=0;j<n;j++){
    h+=`<div class="rh"><span class="tag">TR${j+1}</span><textarea data-r="${j}" placeholder="${esc(T.reqPh)}" aria-label="TR${j+1}">${esc(S.r[j])}</textarea>${n>2?`<button type="button" class="x" data-delr="${j}" title="${esc(T.delR)}" aria-label="${esc(T.delR)} ${j+1}">×</button>`:""}</div>`;
  }
  h+=`<div class="addc">${n<MAXR?`<button type="button" data-addr title="${esc(T.addR)}" aria-label="${esc(T.addR)}">+</button>`:""}</div>`;
  if(on)h+=`<div class="sp"></div><div class="h dark" style="justify-content:center">${T.us}</div><div class="h dark" style="justify-content:center">${T.rv}</div><div class="h dark" style="justify-content:center">${T.gap}</div>`;
  S.v.forEach((v,i)=>{
    h+=`<div class="vc"><textarea data-v="${i}" placeholder="${esc(T.voicePh)}" aria-label="${esc(T.vDef)} ${i+1}">${esc(v.t)}</textarea>${S.v.length>1?`<button type="button" class="x" data-delv="${i}" title="${esc(T.delV)}" aria-label="${esc(T.delV)} ${i+1}">×</button>`:""}</div>`;
    h+=`<div class="ic"><select data-w="${i}" aria-label="${esc(T.imp)} ${i+1}">${[1,2,3,4,5].map(k=>`<option${k===v.w?" selected":""}>${k}</option>`).join("")}</select></div>`;
    for(let j=0;j<n;j++){const val=S.m[i][j]||0;h+=`<div class="mc"><button type="button" data-m="${i}-${j}" data-v="${val}" aria-label="${esc(vName(i))} × ${esc(rName(j))}: ${val||"–"}">${val||""}</button></div>`}
    h+=`<div class="sp"></div>`;
    if(on){const g=S.comp.us[i]-S.comp.rv[i];
      h+=`<div class="sp"></div><div class="cs"><select data-us="${i}">${[1,2,3,4,5].map(k=>`<option${k===S.comp.us[i]?" selected":""}>${k}</option>`).join("")}</select></div><div class="cs"><select data-rv="${i}">${[1,2,3,4,5].map(k=>`<option${k===S.comp.rv[i]?" selected":""}>${k}</option>`).join("")}</select></div><div class="gp${g<0?" neg":""}" data-gap="${i}">${g>0?"+"+g:g}</div>`}
  });
  h+=`<div class="addrow">${S.v.length<MAXV?`<button type="button" data-addv>${esc(T.addV)}</button>`:""}</div>`;
  [["abs",T.abs],["rel",T.rel],["rank",T.rank]].forEach(([k,label])=>{
    h+=`<div class="rl">${label}</div>`;
    for(let j=0;j<n;j++)h+=`<div class="rv" data-k="${k}-${j}"></div>`;
    h+=`<div class="sp"></div>`; if(on)h+=`<div class="sp"></div><div class="sp"></div><div class="sp"></div><div class="sp"></div>`;
  });
  h+=`</div>`;
  $("inner").innerHTML=h;
  renderRoof(); update();
}
const ROOFCLS={"++":"pp","+":"p","−":"n","−−":"nn"};
function renderRoof(){
  const n=S.r.length; let s="";
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const k=j-i, cx=(i+j+1)/2*W, cy=n*W/2-k*W/2, hw=W/2-1, v=S.roof[i+"-"+j]||"";
    const lab=`TR${i+1} × TR${j+1}: ${rName(i)} / ${rName(j)}`;
    s+=`<g class="diamond ${v?ROOFCLS[v]:"empty"}" data-roof="${i}-${j}" tabindex="0" role="button" aria-label="${esc(lab)}: ${v||"–"}"><title>${esc(lab)}</title><polygon points="${cx},${cy-hw} ${cx+hw},${cy} ${cx},${cy+hw} ${cx-hw},${cy}"/><text x="${cx}" y="${cy}">${v}</text></g>`;
  }
  $("roof").innerHTML=s;
}
function negPairs(){return Object.entries(S.roof).filter(([k,v])=>v==="−"||v==="−−").map(([k])=>{const [a,b]=k.split("-").map(Number);return `${rName(a)} ↔ ${rName(b)}`})}
function update(){
  const T=tt(), c=calc(), top=c.abs.indexOf(Math.max(...c.abs));
  c.abs.forEach((a,j)=>{
    const set=(k,t,isTop)=>{const el=document.querySelector(`[data-k="${k}-${j}"]`);if(el){el.textContent=t;el.classList.toggle("top",!!isTop&&c.rank[j]===1)}};
    set("abs",a||"0"); set("rel",(c.rel[j]*100).toFixed(1)+"%"); set("rank",c.rank[j]??"–",true);
  });
  const order=S.r.map((_,j)=>j).sort((a,b)=>c.abs[b]-c.abs[a]||a-b), mx=Math.max(...c.abs,1);
  $("bars").innerHTML=order.map((j,k)=>`<div class="bar${k===0&&c.abs[j]>0?" first":""}"><div class="t"><span>${k===0&&c.abs[j]>0?`<span class="badge">1</span>`:""}${esc(rName(j))}</span><b>${(c.rel[j]*100).toFixed(1)}%</b></div><div class="track"><div class="fill" style="width:${c.abs[j]/mx*100}%"></div></div></div>`).join("");
  let rd="", win="", trade="", pt1="";
  const tv=S.v.map((v,i)=>({i,w:v.w})).sort((a,b)=>b.w-a.w||a.i-b.i)[0]; if(tv&&S.v[tv.i].t.trim())pt1=T.sugVoice(vName(tv.i),tv.w);
  const neg=negPairs();
  trade=neg.length?T.trade(neg.join("; ")):T.noTrade;
  if(c.tot>0){
    const pct=(c.rel[top]*100).toFixed(1);
    const contrib=S.v.map((v,i)=>({i,s:v.w*(S.m[i][top]||0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>`"${vName(x.i)}" (${S.v[x.i].w}×${S.m[x.i][top]})`).join(", ");
    win=T.top(rName(top),pct)+(contrib?" "+T.contrib(contrib):"");
    rd=`<p><b>${esc(T.top(rName(top),pct))}</b></p>`+(contrib?`<p>${esc(T.contrib(contrib))}</p>`:"")+`<p>${esc(trade)}</p>`;
  } else rd=`<p>${esc(T.emptyRead)}</p>`;
  AUTO={win,trade,pt1,pt3:win};
  $("read").innerHTML=rd;
  const ch=[];
  if(S.v.some(v=>!v.t.trim())||S.r.some(r=>!r.trim()))ch.push(T.c_empty);
  S.v.forEach((v,i)=>{if(v.t.trim()&&!S.m[i].some(x=>x))ch.push(T.c_noRelV(v.t.trim()))});
  S.r.forEach((r,j)=>{if(r.trim()&&!S.v.some((_,i)=>S.m[i][j]))ch.push(T.c_noRelR(r.trim()))});
  if(S.v.length>=3&&S.v.every(v=>v.w===S.v[0].w))ch.push(T.c_same);
  if(!Object.values(S.roof).some(Boolean))ch.push(T.c_roof);
  $("checks").innerHTML=ch.length?ch.map(x=>`<li>${esc(x)}</li>`).join(""):`<li class="ok">${esc(T.c_ok)}</li>`;
  save();
}
function report(){
  const T=tt(), R=T.rep, c=calc(), team=S.mode==="team", own=S.caseIdx===8;
  const order=S.r.map((_,j)=>j).sort((a,b)=>c.abs[b]-c.abs[a]||a-b);
  let t=`${R[0]}: ${caseName()||"-"}\n\n`;
  if(team&&S.members.trim())t+=`${R[11]}\n${S.members.trim()}\n\n`;
  if(own){const o=S.own;t+=`${R[14]}\n`+[[15,"what"],[16,"who"],[17,"tension"],[18,"need"]].filter(([i,f])=>o[f].trim()).map(([i,f])=>`- ${R[i]}: ${o[f].trim()}`).join("\n")+"\n\n"}
  if(team&&S.princ.length)t+=`${R[12]}\n`+S.princ.map(i=>`- ${CASES[i].p[S.lang==="es"?1:0]}`).join("\n")+"\n\n";
  if(S.notes.trim())t+=`${R[1]}\n${S.notes.trim()}\n\n`;
  t+=`${R[2]}\n${S.ans.trim()||"-"}\n\n`;
  t+=`${R[3]}\n${R[4]}:\n`+S.v.map((v,i)=>`- ${vName(i)} (${v.w})`).join("\n")+`\n\n${R[5]}:\n`+order.map((j,k)=>`${k+1}. ${rName(j)}: ${(c.rel[j]*100).toFixed(1)}%`).join("\n")+"\n\n";
  t+=`${R[6]}\n${R[7]}: ${S.win.trim()||"-"}\n${R[8]}: ${S.trade.trim()||"-"}\n${R[9]}: ${S.rec.trim()||"-"}\n\n`;
  if(team)t+=`${R[13]}\n1. ${S.pt1.trim()||"-"}\n2. ${S.pt2.trim()||"-"}\n3. ${S.pt3.trim()||"-"}\n\n`;
  return t+R[10]+"\n";
}
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1800)}

/* events */
const inner=$("inner");
inner.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.v!==undefined){S.v[+t.dataset.v].t=t.value;update()}
  else if(t.dataset.r!==undefined){S.r[+t.dataset.r]=t.value;update();document.querySelectorAll(".diamond").forEach(g=>{const [i,j]=g.dataset.roof.split("-").map(Number);g.querySelector("title").textContent=`TR${i+1} × TR${j+1}: ${rName(i)} / ${rName(j)}`})}
});
inner.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.w!==undefined){S.v[+t.dataset.w].w=+t.value;update()}
  else if(t.dataset.us!==undefined){S.comp.us[+t.dataset.us]=+t.value;update()}
  else if(t.dataset.rv!==undefined){S.comp.rv[+t.dataset.rv]=+t.value;update()}
});
const NEXT={0:9,9:3,3:1,1:0};
const RNEXT={"":"++","++":"+","+":"−","−":"−−","−−":""};
inner.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-roof]"); if(!b)return;
  if(b.dataset.m){const [i,j]=b.dataset.m.split("-").map(Number);const v=NEXT[S.m[i][j]||0];S.m[i][j]=v;b.dataset.v=v;b.textContent=v||"";update()}
  else if(b.dataset.roof){const k=b.dataset.roof,v=RNEXT[S.roof[k]||""];if(v)S.roof[k]=v;else delete S.roof[k];renderRoof();update()}
  else if(b.hasAttribute("data-addv")){if(S.v.length<MAXV){S.v.push({t:"",w:3});S.m.push(S.r.map(()=>0));S.comp.us.push(3);S.comp.rv.push(3);renderHouse()}}
  else if(b.hasAttribute("data-addr")){if(S.r.length<MAXR){S.r.push("");S.m.forEach(r=>r.push(0));renderHouse()}}
  else if(b.dataset.delv!==undefined){const i=+b.dataset.delv;S.v.splice(i,1);S.m.splice(i,1);S.comp.us.splice(i,1);S.comp.rv.splice(i,1);renderHouse()}
  else if(b.dataset.delr!==undefined){const d=+b.dataset.delr;S.r.splice(d,1);S.m.forEach(r=>r.splice(d,1));
    const nr={};Object.entries(S.roof).forEach(([k,v])=>{let [a,c]=k.split("-").map(Number);if(a===d||c===d)return;if(a>d)a--;if(c>d)c--;nr[a+"-"+c]=v});S.roof=nr;renderHouse()}
});
inner.addEventListener("keydown",e=>{
  const g=e.target.closest&&e.target.closest("[data-roof]");
  if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();g.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
  const b=e.target.closest&&e.target.closest("[data-m]");
  if(b&&e.key.length===1&&"0139".includes(e.key)){const [i,j]=b.dataset.m.split("-").map(Number);const v=+e.key;S.m[i][j]=v;b.dataset.v=v;b.textContent=v||"";update()}
});
document.addEventListener("input",e=>{
  const f=e.target.dataset&&e.target.dataset.f; if(!f)return;
  S[f]=e.target.value; if(f==="ans")updateCount(); save();
});
$("cases").addEventListener("click",e=>{const b=e.target.closest("[data-case]");if(!b)return;
  if(b.dataset.case==="own"){S.caseIdx=8;renderCases();save();openOwn()}else{S.caseIdx=+b.dataset.case;renderCases();save()}});
$("casebox").addEventListener("click",e=>{if(e.target.closest("[data-ownedit]"))openOwn()});
$("o-save").addEventListener("click",()=>{document.querySelectorAll("[data-o]").forEach(el=>{S.own[el.dataset.o]=el.value});closeOwn();renderCases();save()});
$("o-cancel").addEventListener("click",closeOwn);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("ov").hidden)closeOwn()});
$("principles").addEventListener("change",e=>{const i=+e.target.dataset.pr;S.princ=S.princ.filter(x=>x!==i);if(e.target.checked)S.princ.push(i);save()});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{S.mode=b.dataset.mode;renderStatic();save()}));
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-sug]"); if(!b)return;
  const f=b.dataset.sug; S[f]=AUTO[f]; $(f).value=S[f]; save();
});
function setHouse(h){KEEP.forEach(k=>{h[k]=S[k]});h.lang=S.lang;S=h}
$("load").addEventListener("click",()=>{snapshot();setHouse(houseExample(S.lang));renderStatic();renderHouse()});
$("blank").addEventListener("click",()=>{snapshot();setHouse(houseBlank());renderStatic();renderHouse()});
$("undo").addEventListener("click",()=>{if(!prev)return;S=JSON.parse(prev);prev=null;$("undo").disabled=true;renderStatic();renderHouse()});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{S.lang=b.dataset.lang;renderStatic();renderHouse()}));
$("copy").addEventListener("click",async()=>{
  const t=report();
  try{await navigator.clipboard.writeText(t);toast(tt().copied)}
  catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(tt().copied)}catch(_){}ta.remove()}
});

S=Object.assign(newState(defLang()),loadSaved()||{});
if(!S.own)S.own={name:"",what:"",who:"",tension:"",need:""};if(!Array.isArray(S.princ))S.princ=[];
if(!S.comp)S.comp={on:false,us:S.v.map(()=>3),rv:S.v.map(()=>3)};
renderStatic(); renderHouse();
</script>
